name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          choco install innosetup --no-progress -y

      - name: Run validation
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean WaterPanda.spec

      - name: Smoke-test executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\WaterPanda\WaterPanda.exe")) { throw "WaterPanda.exe was not created" }
          if (-not (Test-Path "dist\WaterPanda\assets\panda.ico")) { throw "Panda icon was not bundled" }

      - name: Exercise packaged Windows UI
        shell: pwsh
        run: |
          $outputPath = Join-Path $PWD "windows-ui-evidence"
          $process = Start-Process -FilePath "dist\WaterPanda\WaterPanda.exe" -ArgumentList "--verify-ui", $outputPath -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged Windows UI validation timed out after 90 seconds"
          }
          Get-Content "$outputPath\report.json"
          if ($process.ExitCode -ne 0) { throw "Packaged Windows UI validation failed" }

      - name: Upload Windows UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Water-Panda-Windows-UI-Evidence
          path: windows-ui-evidence/
          if-no-files-found: warn

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\WaterPanda.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Water-Panda-Windows-Installer
          path: installer/output/Water_Panda_Setup.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/Water_Panda_Setup.exe
          generate_release_notes: true
